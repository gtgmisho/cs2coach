"CS2 AI Coach GSI"
{
    // Where CS2 sends its JSON (HTTP POST). Must match --port in coach_app.py.
    "uri"          "http://127.0.0.1:3000/"

    // timeout:   seconds CS2 waits for our HTTP response
    // buffer:    batch changes that happen within 100 ms into one POST
    // throttle:  at most one POST every 0.5 s
    // heartbeat: send a POST at least every 10 s, even if nothing changed
    "timeout"      "5.0"
    "buffer"       "0.1"
    "throttle"     "0.5"
    "heartbeat"    "10.0"

    // Shared secret. CS2 copies it into every payload and coach_app.py ignores
    // payloads that don't carry it. If you change it here, start the app with
    // the same value: python coach_app.py --token <your_token>
    "auth"
    {
        "token"    "cs2coach_local_token"
    }

    // Data blocks CS2 includes in each payload:
    //   provider           - game client info, including YOUR steamid
    //   map                - map name, mode, phase, team scores, round number
    //   round              - round phase (freezetime/live/over), bomb, winner
    //   player_id          - name, steamid, team of the player being viewed
    //   player_state       - health, armor, money, flashed, equip value, ...
    //   player_weapons     - weapons, ammo, which one is active
    //   player_match_stats - kills, assists, deaths, MVPs, score
    "data"
    {
        "provider"             "1"
        "map"                  "1"
        "round"                "1"
        "player_id"            "1"
        "player_state"         "1"
        "player_weapons"       "1"
        "player_match_stats"   "1"
    }
}
